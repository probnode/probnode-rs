name: Bug report
description: Something in probnode-rs does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not paste an API key anywhere in this form.
        Security issues go privately to hello@probnode.com, not here (see SECURITY.md).
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - probnode::Client (async)
        - probnode::blocking::Client
        - probe feature
        - Documentation
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: "cargo tree -i probnode, or the tag you depend on"
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Rust version and OS
      placeholder: "rustc 1.85, Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The code or command you ran, and what it printed, including the full error.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Dataset, schema, format, market or time range involved, if relevant.
