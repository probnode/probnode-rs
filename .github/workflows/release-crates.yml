name: release-crates

# Publishes the probnode crate to crates.io when a version tag is pushed. Uses crates.io trusted
# publishing (OIDC): configure the trusted publisher on crates.io for repository
# probnode/probnode-rs, workflow release-crates.yml, environment crates-io. No token is stored.
#
# The `probe` feature depends on probe-format 0.1; publish probe-format first, or `cargo publish`
# cannot resolve it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'probnode/probnode-rs'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: The tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | python3 -c "import json,sys; print([p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='probnode'][0])")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != crate version $v"; exit 1; }
      - run: cargo test --all-features
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p probnode
